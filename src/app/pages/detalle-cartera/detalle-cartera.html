<app-global-header [tabs]="headerTabs">
  <app-collections-filters-modal filters-trigger />
  <app-collections-filter-chips-summary chips />
  <ng-container actions>
    <p-button
      label="Limpiar filtros"
      severity="secondary"
      [text]="true"
      size="small"
      (onClick)="collectionsData.clearFilters()"
    />
    <p-button
      severity="secondary"
      [text]="true"
      size="small"
      ariaLabel="Guardar como vista por defecto"
      [pTooltip]="'Guarda el filtro actual como la vista que se carga siempre'"
      tooltipPosition="bottom"
      (onClick)="onSaveAsDefault()"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
    </p-button>
  </ng-container>
</app-global-header>

<main class="page-body">
  @if (collectionsData.loading()) {
    <app-loading-skeleton height="480px" />
  } @else {
    <div class="detalle-cartera-view-toggle">
      <p-selectButton
        [options]="viewModeOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="viewMode()"
        (onChange)="onViewModeChange($event.value)"
      />
    </div>

    @if (viewMode() === 'tabla') {
      <app-collections-detail-tree-table
        [documents]="collectionsData.scopedDocuments()"
        [cutoffDate]="collectionsData.cutoffDate()"
        [focusedCounterpartyId]="focusedCounterpartyId()"
        (counterpartyFocused)="focusedCounterpartyId.set($event)"
      />
    } @else {
      <app-collections-detail-treemap
        [documents]="collectionsData.scopedDocuments()"
        [focusedCounterpartyId]="focusedCounterpartyId()"
        (counterpartyFocused)="focusedCounterpartyId.set($event)"
      />
    }
  }

  <app-collections-footer />
</main>
