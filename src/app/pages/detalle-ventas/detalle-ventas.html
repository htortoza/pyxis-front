<app-global-header [tabs]="headerTabs">
  <app-filters-modal filters-trigger />
  <app-filter-chips-summary chips />
  <ng-container actions>
    <p-button
      label="Limpiar filtros"
      severity="secondary"
      [text]="true"
      size="small"
      (onClick)="salesData.clearFilters()"
    />
    <p-button
      severity="secondary"
      [text]="true"
      size="small"
      ariaLabel="Guardar como vista por defecto"
      [pTooltip]="'Guarda el filtro actual como la vista que se carga siempre'"
      tooltipPosition="bottom"
      (onClick)="onSaveAsDefault()"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
    </p-button>
  </ng-container>
</app-global-header>

<main class="page-body">
  @if (salesData.loading()) {
    <app-loading-skeleton height="480px" />
  } @else {
    <div class="detalle-ventas-view-toggle">
      <p-selectButton
        [options]="viewModeOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="viewMode()"
        (onChange)="onViewModeChange($event.value)"
      />
    </div>

    @if (viewMode() === 'tabla') {
      <app-sales-detail-tree-table
        [tree]="detailTree()"
        [selectedPeriodIds]="salesData.selectedPeriodIds()"
        [periods]="salesData.periods()"
        [focusedFamiliaId]="focusedFamiliaId()"
        [focusedSubfamiliaId]="focusedSubfamiliaId()"
        (familiaFocused)="focusedFamiliaId.set($event)"
        (subfamiliaFocused)="focusedSubfamiliaId.set($event)"
      />
    } @else {
      <app-sales-detail-treemap
        [tree]="detailTree()"
        [periods]="salesData.periods()"
        [selectedPeriodIds]="salesData.selectedPeriodIds()"
        [focusedFamiliaId]="focusedFamiliaId()"
        [focusedSubfamiliaId]="focusedSubfamiliaId()"
        (familiaFocused)="focusedFamiliaId.set($event)"
        (subfamiliaFocused)="focusedSubfamiliaId.set($event)"
      />
    }
  }
</main>
