<p-toolbar class="global-header-toolbar">
  <ng-template pTemplate="start">
    <div class="global-header-start">
      <img class="global-header-mobile-logo" src="constellation-icon.svg" alt="Pyxis" />
      <ng-content select="[filters-trigger]" />
    </div>
  </ng-template>

  <ng-template pTemplate="end">
    <nav class="global-header-tabs">
      @for (tab of tabs(); track tab.route) {
        <a
          [routerLink]="tab.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: tab.exact ?? false }"
          class="global-header-nav-link"
        >
          {{ tab.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="global-header-burger"
      aria-label="Abrir menú"
      (click)="mobileNav.toggle()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </ng-template>
</p-toolbar>

<div class="global-header-chips-scroll">
  <ng-content select="[chips]" />
  <div class="global-header-actions-sticky">
    <ng-content select="[actions]" />
  </div>
</div>
